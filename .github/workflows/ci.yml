name: CI

on:
  push:
    branches: ["main", "master", "feature/**", "chore/**"]
  pull_request:

jobs:
  backend-tests:
    # Unit tests stub torch/transformers and use fake ML models, so CI does not
    # need to download multi-GB model weights. Keep this job fast.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy librosa soundfile webrtcvad-wheels pytest

      - name: Run backend unit tests
        run: pytest tests -q

  frontend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
